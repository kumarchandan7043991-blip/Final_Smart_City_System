        if (index === 0) slideEl.classList.add('active');
        slideEl.innerHTML = `
          <div class="slide-subtitle">${slide.subtitle}</div>
          <h1 class="slide-title glow-title">${slide.title}</h1>
          <div class="text-grid">${slide.content}</div>
          ${slide.visual || ''}
          <div class="slide-footer"><span>Slide ${index + 1} of ${slidesData.length}</span><span class="footer-small">Use ← → or click dots to navigate.</span></div>
        `;
        slideContainer.appendChild(slideEl);
        const dot = document.createElement('button');
        dot.className = 'nav-button';
        if (index === 0) dot.classList.add('active');
        dot.addEventListener('click', () => goToSlide(index));
        navDots.appendChild(dot);
      });
    }
    function goToSlide(index) {
      const slides = document.querySelectorAll('.slide');
      if (index < 0 || index >= slides.length) return;
      slides[currentSlide].classList.remove('active');
      navDots.children[currentSlide].classList.remove('active');
      currentSlide = index;
      slides[currentSlide].classList.add('active');
      navDots.children[currentSlide].classList.add('active');
    }
    window.addEventListener('keydown', event => {
      if (event.key === 'ArrowRight' || event.key === 'PageDown') {
        goToSlide(Math.min(currentSlide + 1, slidesData.length - 1));
      }
      if (event.key === 'ArrowLeft' || event.key === 'PageUp') {
        goToSlide(Math.max(currentSlide - 1, 0));
      }
    });
    slideContainer.addEventListener('click', () => goToSlide(Math.min(currentSlide + 1, slidesData.length - 1)));
    function initParticles() {
      const canvas = document.getElementById('particleCanvas');
      const ctx = canvas.getContext('2d');
      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;
      const particles = Array.from({ length: 90 }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        vx: (Math.random() - 0.5) * 0.5,
        vy: (Math.random() - 0.5) * 0.5,
        size: Math.random() * 2.2 + 1.4,
        alpha: Math.random() * 0.4 + 0.15
      }));
      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      function draw() {
        ctx.clearRect(0, 0, width, height);
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0 || p.x > width) p.vx *= -1;
          if (p.y < 0 || p.y > height) p.vy *= -1;
          ctx.fillStyle = `rgba(47, 228, 255, ${p.alpha})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        });
        requestAnimationFrame(draw);
      }
      draw();
    }

    function init() {
      createSlides();
      initParticles();
    }
    init();
  </script>
</body>
</html>
